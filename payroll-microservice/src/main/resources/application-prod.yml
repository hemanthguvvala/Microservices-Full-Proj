spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payrolldb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  h2:
    console:
      enabled: false

logging:
  level:
    com.example.payroll: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
