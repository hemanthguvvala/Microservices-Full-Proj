spring:
  application:
    name: payroll-service
  
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  flyway:
    enabled: false
  
  kafka:
    bootstrap-servers: localhost:9092
  
  redis:
    host: localhost
    port: 6379

eureka:
  client:
    enabled: false

logging:
  level:
    com.example.payroll: DEBUG
