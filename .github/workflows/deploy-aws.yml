# ═══════════════════════════════════════════════════════════════════════════════
# Multi-Cloud Deploy Pipeline — AWS EKS
# ═══════════════════════════════════════════════════════════════════════════════
#
# Interview: "How does your CI/CD pipeline deploy to AWS?"
# → GitHub Actions workflow triggered on main branch push.
#   Uses OIDC federation (no long-lived AWS keys stored in secrets).
#   Builds Docker image → pushes to ECR → updates EKS deployment.
#   Canary deployment with kubectl rollout status for verification.
#
# Interview: "What is OIDC federation for CI/CD?"
# → GitHub Actions generates a short-lived JWT token. AWS STS exchanges
#   it for temporary credentials via AssumeRoleWithWebIdentity.
#   No access keys needed. Scoped to specific repo + branch.

name: Deploy to AWS EKS

on:
  push:
    branches: [main]
    paths:
      - 'employee-microservice/**'
      - 'k8s/base/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      service:
        description: 'Service to deploy'
        required: true
        default: 'employee-service'
        type: choice
        options:
          - employee-service
          - notification-service
          - payroll-service
          - api-gateway

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: employee-platform-${{ inputs.environment || 'staging' }}
  NAMESPACE: employee-platform

jobs:
  # ── Build & Push to ECR ──────────────────────────────────────────────────
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: employee-microservice
        run: |
          mvn package -DskipTests -Dspring.profiles.active=aws
          echo "Build completed for AWS profile"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/employee-service
          tags: |
            type=sha,prefix=aws-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: employee-microservice
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPRING_PROFILES_ACTIVE=aws
            JAR_FILE=target/*.jar

      # ── Trivy vulnerability scan ──────────────────────────────────────
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/employee-service:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

  # ── Deploy to EKS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: https://${{ inputs.environment || 'staging' }}-api.employee-platform.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy with Kustomize
        run: |
          cd k8s/base
          kustomize edit set image \
            employee-service=${{ env.ECR_REGISTRY }}/employee-service:${{ needs.build-push.outputs.image-tag }}

          # Apply with server-side apply for conflict resolution
          kubectl apply -k . \
            --namespace ${{ env.NAMESPACE }} \
            --server-side \
            --force-conflicts

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/employee-service \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Verify deployment health
        run: |
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod \
            -l app=employee-service \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=120s

          # Check health endpoint
          POD=$(kubectl get pod -l app=employee-service -n ${{ env.NAMESPACE }} -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $POD -n ${{ env.NAMESPACE }} -- \
            curl -sf http://localhost:8080/actuator/health | jq .

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back..."
          kubectl rollout undo deployment/employee-service \
            --namespace ${{ env.NAMESPACE }}
          kubectl rollout status deployment/employee-service \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=300s

  # ── Post-Deploy Smoke Tests ────────────────────────────────────────────
  smoke-test:
    name: Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Run smoke tests
        run: |
          # Port-forward to the service
          kubectl port-forward svc/employee-service 8080:8080 \
            -n ${{ env.NAMESPACE }} &
          sleep 5

          # Health check
          curl -sf http://localhost:8080/actuator/health | jq .

          # API smoke test
          curl -sf http://localhost:8080/api/v1/employees?page=0&size=1 | jq .status

          echo "Smoke tests passed"
