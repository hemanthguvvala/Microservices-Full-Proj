# ─── Eureka Discovery Server CI/CD Pipeline ──────────────────────────────────
# Interview insight: Eureka is infrastructure-critical — if it goes down,
# service discovery breaks. CI ensures it stays stable across deployments.

name: Eureka Discovery Server CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'eureka-discovery-server/**'
      - '.github/workflows/eureka-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'eureka-discovery-server/**'

defaults:
  run:
    working-directory: eureka-discovery-server

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run tests
        run: mvn test

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: eureka-discovery-server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/eureka-server:${{ github.sha }}
            ghcr.io/${{ github.repository }}/eureka-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
