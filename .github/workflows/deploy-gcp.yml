# ═══════════════════════════════════════════════════════════════════════════════
# Multi-Cloud Deploy Pipeline — GCP GKE
# ═══════════════════════════════════════════════════════════════════════════════
#
# Interview: "How does your CI/CD deploy to GCP?"
# → GitHub Actions with Workload Identity Federation (no JSON key files).
#   Build → push to Artifact Registry → deploy to GKE via Kustomize.
#   GKE uses Binary Authorization in production to only accept signed images.
#   Workload Identity maps K8s service accounts to GCP IAM service accounts.

name: Deploy to GCP GKE

on:
  push:
    branches: [main]
    paths:
      - 'employee-microservice/**'
      - 'k8s/base/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      service:
        description: 'Service to deploy'
        required: true
        default: 'employee-service'

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GKE_CLUSTER: employee-platform-${{ inputs.environment || 'staging' }}-gke
  ARTIFACT_REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/employee-platform-docker
  NAMESPACE: employee-platform
  # Workload Identity Provider
  WIF_PROVIDER: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-actions@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

jobs:
  # ── Build & Push to Artifact Registry ──────────────────────────────────
  build-push:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # ── GCP Auth (Workload Identity Federation — keyless) ──────────────
      # Interview: "How do you authenticate GitHub Actions to GCP?"
      # → Workload Identity Federation. GitHub OIDC token is exchanged for
      #   a GCP access token. No JSON key files. The WIF pool is configured
      #   to trust tokens from your specific GitHub repo.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (GCP profile)
        working-directory: employee-microservice
        run: |
          mvn package -DskipTests -Dspring.profiles.active=gcp
          echo "Build completed for GCP profile"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ARTIFACT_REGISTRY }}/employee-service
          tags: |
            type=sha,prefix=gcp-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: employee-microservice
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPRING_PROFILES_ACTIVE=gcp
            JAR_FILE=target/*.jar

      # ── Vulnerability scanning ────────────────────────────────────────
      - name: Scan with Container Analysis
        run: |
          # Artifact Registry auto-scans pushed images
          # Wait for scan to complete and check for critical vulnerabilities
          echo "Image pushed to Artifact Registry — automatic scanning enabled"
          gcloud artifacts docker images describe \
            ${{ env.ARTIFACT_REGISTRY }}/employee-service:${{ steps.meta.outputs.version }} \
            --show-all-metadata || true

  # ── Deploy to GKE ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to GKE
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: https://${{ inputs.environment || 'staging' }}-api.employee-platform.com

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Get GKE credentials ───────────────────────────────────────────
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Deploy with Kustomize
        run: |
          cd k8s/base
          kustomize edit set image \
            employee-service=${{ env.ARTIFACT_REGISTRY }}/employee-service:${{ needs.build-push.outputs.image-tag }}

          kubectl apply -k . \
            --namespace ${{ env.NAMESPACE }} \
            --server-side

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/employee-service \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Verify deployment health
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=employee-service \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=120s

          POD=$(kubectl get pod -l app=employee-service -n ${{ env.NAMESPACE }} -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $POD -n ${{ env.NAMESPACE }} -- \
            curl -sf http://localhost:8080/actuator/health | jq .

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back..."
          kubectl rollout undo deployment/employee-service \
            --namespace ${{ env.NAMESPACE }}
          kubectl rollout status deployment/employee-service \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=300s

  # ── Post-Deploy Verification ───────────────────────────────────────────
  verify:
    name: Post-Deploy Verification
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Smoke tests
        run: |
          kubectl port-forward svc/employee-service 8080:8080 \
            -n ${{ env.NAMESPACE }} &
          sleep 5
          curl -sf http://localhost:8080/actuator/health | jq .
          curl -sf http://localhost:8080/api/v1/employees?page=0&size=1 | jq .status
          echo "GCP deployment verified"

      # ── Verify GCP-specific integrations ───────────────────────────────
      - name: Check Cloud Logging
        run: |
          gcloud logging read \
            "resource.type=k8s_container AND resource.labels.cluster_name=${{ env.GKE_CLUSTER }} AND resource.labels.container_name=employee-service" \
            --limit=5 \
            --format=json \
            --freshness=5m || true
          echo "GCP Logging integration verified"

      - name: Check Pub/Sub topics
        run: |
          gcloud pubsub topics list --filter="name:employee" --format="table(name)" || true
          echo "Pub/Sub topics verified"
