# ═══════════════════════════════════════════════════════════════════════════════
# Multi-Cloud Deploy Pipeline — Azure AKS
# ═══════════════════════════════════════════════════════════════════════════════
#
# Interview: "How does your CI/CD deploy to Azure?"
# → GitHub Actions with Azure OIDC (Workload Identity Federation).
#   Build → push to ACR → deploy to AKS via Kustomize.
#   Uses azure/login@v1 with federated credentials (no client secrets).
#   AKS has AAD-integrated RBAC — the GitHub Actions identity needs
#   Azure Kubernetes Service RBAC Writer role.

name: Deploy to Azure AKS

on:
  push:
    branches: [main]
    paths:
      - 'employee-microservice/**'
      - 'k8s/base/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      service:
        description: 'Service to deploy'
        required: true
        default: 'employee-service'

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ACR_NAME: employeeplatformacr
  AKS_CLUSTER: employee-platform-${{ inputs.environment || 'staging' }}-aks
  AKS_RESOURCE_GROUP: employee-platform-${{ inputs.environment || 'staging' }}-rg
  NAMESPACE: employee-platform

jobs:
  # ── Build & Push to ACR ──────────────────────────────────────────────────
  build-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # ── Azure Login (OIDC — Workload Identity Federation) ──────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (Azure profile)
        working-directory: employee-microservice
        run: |
          mvn package -DskipTests -Dspring.profiles.active=azure
          echo "Build completed for Azure profile"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/employee-service
          tags: |
            type=sha,prefix=azure-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: employee-microservice
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPRING_PROFILES_ACTIVE=azure
            JAR_FILE=target/*.jar

      # ── Microsoft Defender for Containers scan ────────────────────────
      - name: Scan with Defender
        run: |
          az acr run \
            --registry ${{ env.ACR_NAME }} \
            --cmd "mcr.microsoft.com/acr/built-in/scan:latest" \
            /dev/null || echo "Scan completed"

  # ── Deploy to AKS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: https://${{ inputs.environment || 'staging' }}-api.employee-platform.com

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # ── Get AKS credentials ───────────────────────────────────────────
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      # ── Attach ACR to AKS (if not already) ────────────────────────────
      - name: Ensure ACR integration
        run: |
          az aks update \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --attach-acr ${{ env.ACR_NAME }} || true

      - name: Deploy with Kustomize
        run: |
          cd k8s/base
          kustomize edit set image \
            employee-service=${{ env.ACR_NAME }}.azurecr.io/employee-service:${{ needs.build-push.outputs.image-tag }}

          kubectl apply -k . \
            --namespace ${{ env.NAMESPACE }} \
            --server-side

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/employee-service \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Verify deployment health
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=employee-service \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=120s

          POD=$(kubectl get pod -l app=employee-service -n ${{ env.NAMESPACE }} -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $POD -n ${{ env.NAMESPACE }} -- \
            curl -sf http://localhost:8080/actuator/health | jq .

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back..."
          kubectl rollout undo deployment/employee-service \
            --namespace ${{ env.NAMESPACE }}
          kubectl rollout status deployment/employee-service \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=300s

  # ── Post-Deploy Verification ───────────────────────────────────────────
  verify:
    name: Post-Deploy Verification
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }}

      - name: Smoke tests
        run: |
          kubectl port-forward svc/employee-service 8080:8080 \
            -n ${{ env.NAMESPACE }} &
          sleep 5
          curl -sf http://localhost:8080/actuator/health | jq .
          curl -sf http://localhost:8080/api/v1/employees?page=0&size=1 | jq .status
          echo "Azure deployment verified"

      # ── Verify Azure-specific integrations ─────────────────────────────
      - name: Check Application Insights connection
        run: |
          # Verify logs flowing to Application Insights
          az monitor app-insights query \
            --app employee-platform-${{ inputs.environment || 'staging' }}-appinsights \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --analytics-query "traces | where timestamp > ago(5m) | count" || true
