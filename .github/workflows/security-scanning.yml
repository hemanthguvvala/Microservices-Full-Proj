# ═══════════════════════════════════════════════════════════════
# Trivy Security Scanning — Container CVE & Misconfiguration Scan
# ═══════════════════════════════════════════════════════════════
# Trivy scans for:
#   1. Container image vulnerabilities (CRITICAL/HIGH CVEs)
#   2. IaC misconfigurations (K8s manifests, Dockerfiles)
#   3. Secrets accidentally committed to code
#   4. SBOM (Software Bill of Materials) generation
#
# Integrated at:
#   - PR checks: block CRITICAL CVEs on new code
#   - Scheduled: Daily scan of ALL deployed images (CVEs can emerge post-deploy)
#   - Push to main: generate SARIF report → GitHub Security tab

name: Security Scanning (Trivy)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'    # Daily at 6am UTC — catch newly disclosed CVEs

jobs:
  # ── Job 1: Scan ALL service container images ──────────────
  scan-container-images:
    name: Container CVE Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write    # Required to upload SARIF to GitHub Security tab
      contents: read

    strategy:
      fail-fast: false           # Continue scanning other services even if one fails
      matrix:
        service:
          - employee-microservice
          - payroll-microservice
          - notification-microservice
          - api-gateway-service
          - eureka-discovery-server
          - bff-service

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: |
          docker build -t ${{ matrix.service }}:scan-${{ github.sha }} \
            ./${{ matrix.service }}/
        continue-on-error: true  # Build might fail on infra-only repos

      - name: Scan image with Trivy (SARIF output for GitHub Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:scan-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          # Do NOT exit-code 1 here — let GitHub show them in Security tab first
          exit-code: '0'
          ignore-unfixed: true         # Don't fail on CVEs with no fix available
          vuln-type: 'os,library'      # Scan both OS packages and libs

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

      - name: Fail on CRITICAL with a fix available (blocks PR merge)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:scan-${{ github.sha }}'
          format: 'table'
          exit-code: '1'              # THIS fails the CI job
          ignore-unfixed: true        # Only fail on fixable CVEs
          severity: 'CRITICAL'        # Only CRITICAL blocks — HIGH just warns
          vuln-type: 'os,library'

  # ── Job 2: Scan K8s manifests for misconfigurations ───────
  scan-iac-misconfigs:
    name: IaC Misconfiguration Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Scan K8s manifests with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './k8s'
          format: 'sarif'
          output: 'trivy-k8s-misconfig.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload K8s misconfiguration SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-k8s-misconfig.sarif'
          category: 'trivy-k8s-iac'

      - name: Fail on CRITICAL K8s misconfiguration
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './k8s'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # ── Job 3: Secret scanning — catch accidentally committed secrets ──
  scan-secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Full history for secret scanning

      - name: Secret scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'table'
          exit-code: '1'      # Always fail on committed secrets

  # ── Job 4: Generate SBOM (Software Bill of Materials) ─────
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [scan-container-images]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM for employee-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'employee-microservice:scan-${{ github.sha }}'
          format: 'cyclonedx'
          output: 'sbom-employee-service.json'
          exit-code: '0'

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: 'sbom-*.json'
          retention-days: 90
