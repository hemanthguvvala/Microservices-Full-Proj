input {
  # Logstash input for JSON logs from services
  tcp {
    port => 5000
    codec => json
  }

  # Alternative: Read from log files
  file {
    path => "/var/log/services/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
}

filter {
  # Parse JSON logs
  json {
    source => "message"
  }

  # Add timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  # Extract service name
  if [serviceName] {
    mutate {
      add_field => { "service" => "%{serviceName}" }
    }
  }

  # Parse stack traces
  if [stackTrace] {
    mutate {
      add_tag => [ "error" ]
    }
  }

  # Grok patterns for specific log formats
  grok {
    match => { 
      "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} \[%{DATA:service}\] %{DATA:class} - %{GREEDYDATA:log_message}" 
    }
  }

  # GeoIP enrichment for access logs (if applicable)
  if [clientIp] {
    geoip {
      source => "clientIp"
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "port" ]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{service}-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Output to console for debugging
  stdout {
    codec => rubydebug
  }

  # Conditional outputs based on log level
  if [level] == "ERROR" or [level] == "FATAL" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "errors-%{+YYYY.MM.dd}"
    }
  }
}
