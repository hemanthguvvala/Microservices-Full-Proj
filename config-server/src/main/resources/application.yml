server:
  port: 8888

spring:
  application:
    name: config-server
  
  # Config Server Configuration
  cloud:
    config:
      server:
        # Native profile - reads from local file system
        native:
          search-locations: file:../config-repository
        # Git backend (alternative)
        git:
          uri: https://github.com/your-org/config-repo
          default-label: main
          clone-on-start: true
          # Uncomment for private repositories
          # username: ${GIT_USERNAME}
          # password: ${GIT_PASSWORD}
  
  profiles:
    active: native  # Use 'git' for Git backend
  
  # Security Configuration
  security:
    user:
      name: config-admin
      password: config-secret

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    org.springframework.cloud.config: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
