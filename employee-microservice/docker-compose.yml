# ┌───────────────────────────────────────────────────────────────────────────────┐
# │ Docker Compose — Local Development Infrastructure                           │
# │                                                                             │
# │ Interview: "Why use an .env file instead of hardcoding credentials?"        │
# │ → "Docker Compose files are committed to Git. If credentials are inline,    │
# │    they're in your repo history forever — even if you delete them later.    │
# │    .env files are in .gitignore and loaded at runtime only."                │
# │                                                                             │
# │ Usage: cp .env.example .env && docker compose up -d                         │
# │ Note: 'version' key is deprecated in Compose V2 (docker compose)           │
# └───────────────────────────────────────────────────────────────────────────────┘

services:
  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - employee-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - employee-network
    deploy:
      resources:
        limits:
          memory: 1G

  # Redis - For caching
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - employee-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  # MongoDB - For audit logs
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: employee_audit_db
    networks:
      - employee-network
    volumes:
      - mongodb-data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M

  # Elasticsearch - For employee search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - employee-network
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1G

  # PostgreSQL Replica (for read operations)
  postgres-replica:
    image: postgres:14
    container_name: postgres-replica
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employeedb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    networks:
      - employee-network
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  employee-network:
    driver: bridge

volumes:
  redis-data:
  mongodb-data:
  elasticsearch-data:
  postgres-replica-data:
