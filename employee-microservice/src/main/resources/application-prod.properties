# Production Profile Configuration

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration (Example for Production)
# Uncomment and configure for actual production database
#spring.datasource.url=jdbc:postgresql://localhost:5432/employeedb
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Database Configuration (Replace with actual DB in production)
spring.datasource.url=jdbc:h2:file:./data/employeedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Disabled for Production)
spring.h2.console.enabled=false

# Logging (INFO level for production)
logging.level.com.example.employee=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator (Expose only health endpoint in production)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

