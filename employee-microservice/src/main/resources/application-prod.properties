# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  PRODUCTION Profile Configuration — 12-Factor App Compliant                ║
# ║  All secrets externalized via environment variables (never hardcoded)       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ── Server Configuration ──────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── PostgreSQL Database Configuration (Production) ────────────────────────────
# 12-Factor App: Config is stored in the environment, never in code.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employeedb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Connection Pool (HikariCP — Spring Boot default) ──────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA/Hibernate Configuration ──────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Flyway Migration ─────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── Redis (Production) ───────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ── Kafka (Production) ───────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ── Eureka (Production) ──────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# ── Logging (INFO level for production) ───────────────────────────────────────
logging.level.root=WARN
logging.level.com.example.employee=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ── Actuator (restricted in production) ───────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized

