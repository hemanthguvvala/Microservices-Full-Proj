# API Gateway Configuration
spring.application.name=api-gateway
server.port=8080

# Config Server
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.username=config-admin
spring.cloud.config.password=config-secret
spring.cloud.config.fail-fast=false

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gateway Configuration
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route Configuration — Employee Service
spring.cloud.gateway.routes[0].id=employee-service
spring.cloud.gateway.routes[0].uri=lb://employee-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/employee-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[1].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[0].filters[1].args.redis-rate-limiter.burstCapacity=20

# Route Configuration — Payroll Service
spring.cloud.gateway.routes[1].id=payroll-service
spring.cloud.gateway.routes[1].uri=lb://payroll-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/payroll-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[1].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[1].filters[1].args.redis-rate-limiter.burstCapacity=20

# Route Configuration — Notification Service
spring.cloud.gateway.routes[2].id=notification-service
spring.cloud.gateway.routes[2].uri=lb://notification-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/notification-service/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].filters[1].name=RequestRateLimiter
spring.cloud.gateway.routes[2].filters[1].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[2].filters[1].args.redis-rate-limiter.burstCapacity=20

# ── API-path routes (Frontend calls /api/* → routed by path to correct service) ──
# Employee API paths: /api/v1/employees, /api/auth, /api/sagas, /api/search, /api/metrics
spring.cloud.gateway.routes[3].id=employee-api
spring.cloud.gateway.routes[3].uri=lb://employee-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/employees/**,/api/auth/**,/api/sagas/**,/api/search/**,/api/metrics/**

# Payroll API paths: /api/payrolls
spring.cloud.gateway.routes[4].id=payroll-api
spring.cloud.gateway.routes[4].uri=lb://payroll-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payrolls/**

# Notification API paths: /api/v1/notifications, /api/v1/files, /graphql
spring.cloud.gateway.routes[5].id=notification-api
spring.cloud.gateway.routes[5].uri=lb://notification-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/notifications/**,/api/v1/files/**,/graphql/**,/graphiql/**

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG

# Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Redis Configuration (for rate limiting)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Timeout Configuration
spring.cloud.gateway.httpclient.connect-timeout=1000
spring.cloud.gateway.httpclient.response-timeout=5s

# CORS Configuration (allow-credentials requires specific origins, not *)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:4201
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization,X-Trace-Id
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600
