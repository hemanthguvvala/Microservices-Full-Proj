{{/*
Config Server — Deployment + Service
Interview insight: Spring Cloud Config Server centralizes configuration
for all microservices. In K8s, it can use ConfigMaps as a native backend
or continue using Git/file-based configs.
*/}}
;
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "employee-platform.labels" . | nindent 4 }}
    app: config-server
spec:
  replicas: {{ .Values.configServer.replicaCount }}
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.configServer.service.port }}"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: config-server-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: config-server
          image: {{ include "employee-platform.image" (dict "global" .Values.global "image" .Values.configServer.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.configServer.service.port }}
          envFrom:
            - secretRef:
                name: config-server-credentials
          env:
            {{- range $key, $value := .Values.configServer.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.configServer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: {{ .Values.global.namespace }}
  labels:
    app: config-server
spec:
  type: {{ .Values.configServer.service.type }}
  selector:
    app: config-server
  ports:
    - name: http
      port: {{ .Values.configServer.service.port }}
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-server-sa
  namespace: {{ .Values.global.namespace }}
{{- end }}
