{{/*
Frontend Angular — Deployment + Service
Interview insight: Angular SPA served via Nginx container, separate from React frontend.
Demonstrates multi-framework frontend architecture in microservices.
*/}}
{{- if .Values.frontendAngular.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-angular
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "employee-platform.labels" . | nindent 4 }}
    app: frontend-angular
spec:
  replicas: {{ .Values.frontendAngular.replicaCount }}
  selector:
    matchLabels:
      app: frontend-angular
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend-angular
    spec:
      containers:
        - name: frontend-angular
          image: {{ include "employee-platform.image" (dict "global" .Values.global "image" .Values.frontendAngular.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontendAngular.service.port }}
          resources:
            {{- toYaml .Values.frontendAngular.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-angular
  namespace: {{ .Values.global.namespace }}
  labels:
    app: frontend-angular
spec:
  type: {{ .Values.frontendAngular.service.type }}
  selector:
    app: frontend-angular
  ports:
    - name: http
      port: {{ .Values.frontendAngular.service.port }}
      targetPort: http
{{- end }}
