{{/*
Eureka Discovery Server — Deployment + Service
Interview insight: Eureka provides service discovery so microservices
can find each other by name instead of hardcoded URLs.
In K8s with Helm, Eureka is still used for Spring Cloud compatibility.
*/}}
{{- if .Values.eurekaServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "employee-platform.labels" . | nindent 4 }}
    app: eureka-server
spec:
  replicas: {{ .Values.eurekaServer.replicaCount }}
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.eurekaServer.service.port }}"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: eureka-server-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: eureka-server
          image: {{ include "employee-platform.image" (dict "global" .Values.global "image" .Values.eurekaServer.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.eurekaServer.service.port }}
          env:
            {{- range $key, $value := .Values.eurekaServer.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.eurekaServer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: {{ .Values.global.namespace }}
  labels:
    app: eureka-server
spec:
  type: {{ .Values.eurekaServer.service.type }}
  selector:
    app: eureka-server
  ports:
    - name: http
      port: {{ .Values.eurekaServer.service.port }}
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eureka-server-sa
  namespace: {{ .Values.global.namespace }}
{{- end }}
