# ─── Kubernetes Secrets ───────────────────────────────────────────────────────
# In production: use AWS Secrets Manager + External Secrets Operator
# or HashiCorp Vault — NEVER commit real secrets to git
# These are base64-encoded PLACEHOLDERS for local/dev
#
# To encode: echo -n 'value' | base64
# To decode: echo 'dmFsdWU=' | base64 -d

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: employee-platform
  labels:
    app.kubernetes.io/part-of: employee-platform
type: Opaque
data:
  # postgres / postgres123 (base64)
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXMxMjM=
  SPRING_DATASOURCE_USERNAME: cG9zdGdyZXM=
  SPRING_DATASOURCE_PASSWORD: cG9zdGdyZXMxMjM=

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: employee-platform
type: Opaque
data:
  # mySecretKey123456789012345678901234567890 (base64)
  JWT_SECRET: bXlTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=

---
apiVersion: v1
kind: Secret
metadata:
  name: config-server-credentials
  namespace: employee-platform
type: Opaque
data:
  # config-admin / config-secret (base64)
  CONFIG_USER: Y29uZmlnLWFkbWlu
  CONFIG_PASSWORD: Y29uZmlnLXNlY3JldA==
