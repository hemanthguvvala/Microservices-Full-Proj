# ═══════════════════════════════════════════════════════════════════════════════
# Kubernetes Secrets — LOCAL DEVELOPMENT ONLY
# ═══════════════════════════════════════════════════════════════════════════════
#
# ⚠️  PRODUCTION: Replace with External Secrets Operator (ESO) + AWS Secrets
#    Manager, or HashiCorp Vault, or Bitnami Sealed Secrets for GitOps.
#    NEVER commit real credentials to source control.
#
# Interview: "How do you manage secrets in Kubernetes at scale?"
# → "We use External Secrets Operator (ESO) which syncs secrets from AWS
#    Secrets Manager into K8s Secret objects. The ExternalSecret CRD
#    references the secret store path — no base64 values in Git. For GitOps
#    (ArgoCD/Flux), we use Bitnami SealedSecrets which are encrypted with a
#    cluster-specific key — safe to commit."
#
# To encode: echo -n 'value' | base64
# To decode: echo 'dmFsdWU=' | base64 -d
# ═══════════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: employee-platform
  labels:
    app.kubernetes.io/part-of: employee-platform
  annotations:
    # Marks this as a dev-only placeholder — CI should reject this in prod
    environment: development
type: Opaque
data:
  # DEV ONLY — rotate before any non-local deployment
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXMxMjM=
  SPRING_DATASOURCE_USERNAME: cG9zdGdyZXM=
  SPRING_DATASOURCE_PASSWORD: cG9zdGdyZXMxMjM=

---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: employee-platform
  annotations:
    environment: development
type: Opaque
data:
  # DEV ONLY — separate from Postgres credentials
  MONGO_ROOT_USER: bW9uZ28tYWRtaW4=
  MONGO_ROOT_PASSWORD: bW9uZ28tZGV2LXBhc3M=

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: employee-platform
  annotations:
    environment: development
type: Opaque
data:
  # DEV ONLY — production must use cryptographically random 256-bit key
  JWT_SECRET: bXlTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=

---
apiVersion: v1
kind: Secret
metadata:
  name: config-server-credentials
  namespace: employee-platform
  annotations:
    environment: development
type: Opaque
data:
  CONFIG_USER: Y29uZmlnLWFkbWlu
  CONFIG_PASSWORD: Y29uZmlnLXNlY3JldA==

