apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-service
  namespace: employee-platform
  labels:
    app: bff-service
    tier: api-aggregation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff-service
  template:
    metadata:
      labels:
        app: bff-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3001"
    spec:
      containers:
        - name: bff-service
          image: ghcr.io/hemanthguvvala/bff-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: EMPLOYEE_SERVICE_URL
              value: "http://employee-service:8081"
            - name: PAYROLL_SERVICE_URL
              value: "http://payroll-service:8082"
            - name: NOTIFY_SERVICE_URL
              value: "http://notification-service:8083"
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: bff-service
  namespace: employee-platform
spec:
  selector:
    app: bff-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
