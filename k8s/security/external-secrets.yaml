# ═══════════════════════════════════════════════════════════════
# External Secrets Operator — AWS Secrets Manager integration
# Replaces plain base64 K8s Secrets with encrypted secrets from AWS/Vault
# Install: helm repo add external-secrets https://charts.external-secrets.io
#          helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
# ═══════════════════════════════════════════════════════════════

# ── SecretStore — points to AWS Secrets Manager ───────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ExternalSecretsRole
          name: external-secrets-sa

---
# ── Vault SecretStore (alternative to AWS) ───────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hashicorp-vault
spec:
  provider:
    vault:
      server: https://vault.employee-platform.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: employee-platform-role
          serviceAccountRef:
            name: external-secrets-sa
            namespace: employee-platform

---
# ── ExternalSecret — Database credentials ────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: employee-platform
spec:
  refreshInterval: 1h          # Rotate every hour
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: database-credentials  # Creates this K8s Secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          managed-by: external-secrets
  data:
    - secretKey: db-password
      remoteRef:
        key: employee-platform/production/database
        property: password
    - secretKey: db-username
      remoteRef:
        key: employee-platform/production/database
        property: username

---
# ── ExternalSecret — Kafka credentials ───────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-credentials
  namespace: employee-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: kafka-credentials
    creationPolicy: Owner
  data:
    - secretKey: sasl-username
      remoteRef:
        key: employee-platform/production/kafka
        property: sasl_username
    - secretKey: sasl-password
      remoteRef:
        key: employee-platform/production/kafka
        property: sasl_password

---
# ── ExternalSecret — JWT Secret + Keycloak client secrets ─────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-secrets
  namespace: employee-platform
spec:
  refreshInterval: 24h       # JWT secrets rotated daily
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: employee-platform/production/auth
        property: jwt_secret
    - secretKey: keycloak-admin-password
      remoteRef:
        key: employee-platform/production/keycloak
        property: admin_password
    - secretKey: keycloak-client-secret-employee
      remoteRef:
        key: employee-platform/production/keycloak
        property: employee_client_secret

---
# ── Push Secret example — write K8s secrets back to Vault ─────
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-generated-credentials
  namespace: employee-platform
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: hashicorp-vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: auto-generated-credentials
  data:
    - match:
        secretKey: generated-api-key
        remoteRef:
          remoteKey: employee-platform/generated
          property: api_key
