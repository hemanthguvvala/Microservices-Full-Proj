apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-angular
  namespace: employee-management
  labels:
    app: frontend-angular
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-angular
  template:
    metadata:
      labels:
        app: frontend-angular
        tier: frontend
    spec:
      containers:
        - name: frontend-angular
          image: frontend-angular:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-angular
  namespace: employee-management
  labels:
    app: frontend-angular
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: frontend-angular
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-angular-ingress
  namespace: employee-management
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: angular.employee-mgmt.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-angular
                port:
                  number: 80
