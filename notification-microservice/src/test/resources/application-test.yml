spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  cache:
    type: none

  graphql:
    graphiql:
      enabled: false

  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false

app:
  notifications:
    in-app:
      enabled: true
  file:
    upload-dir: ./test-uploads

logging:
  level:
    com.example.notification: DEBUG
