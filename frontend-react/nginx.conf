# ─── Nginx Configuration for React SPA ──────────────────────────────────────
# This is production-grade nginx config used at MNCs
# Covers: SPA routing, gzip, security headers, caching, rate limiting

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ─────────────────────────────────────────────────
    # Reduces transfer size by 60-80% for text-based assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Security Headers ─────────────────────────────────────────────────
    # These are REQUIRED at MNCs — security team reviews these in every PR
    # OWASP recommends all of these

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking protection
    add_header X-Frame-Options "SAMEORIGIN" always;

    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy — don't leak URLs to third parties
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy — disable unnecessary browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS — force HTTPS (set by load balancer in most MNCs, but defense in depth)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy — prevents XSS, data injection attacks
    # In real MNCs, this is the MOST important security header
    # Customize based on your actual CDN, API domains, analytics providers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.example.com https://*.sentry.io; frame-ancestors 'self';" always;

    # ── SPA Routing ──────────────────────────────────────────────────────
    # All routes fall back to index.html (React Router handles routing)
    # This is THE most important config for any SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static Asset Caching ─────────────────────────────────────────────
    # Vite adds content hashes to filenames (main.a1b2c3.js)
    # So we can cache aggressively — if content changes, filename changes
    
    # JS/CSS with hash — cache for 1 year (immutable)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images, fonts, media — cache for 30 days
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # index.html — NEVER cache (must always get latest version)
    # This ensures users always get the newest JS/CSS bundle references
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Health Check Endpoint ────────────────────────────────────────────
    # Used by Kubernetes liveness/readiness probes, ALB health checks, etc.
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── API Proxy (optional) ─────────────────────────────────────────────
    # If your frontend needs to proxy API calls to avoid CORS
    # Uncomment and configure for your backend
    # location /api/ {
    #     proxy_pass http://api-gateway:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 30s;
    #     proxy_connect_timeout 10s;
    # }

    # ── Block sensitive files ────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to source maps in production (security)
    location ~* \.map$ {
        deny all;
    }
}
