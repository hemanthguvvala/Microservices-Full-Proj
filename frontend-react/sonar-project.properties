# SonarQube Configuration
# Used by: Banks (JPMorgan, Goldman), Healthcare (UnitedHealth), Enterprise (SAP, Oracle)
# Also: SonarCloud (hosted version) used by open-source projects and startups
#
# What SonarQube does at MNCs:
# - Code smell detection (dead code, duplications, complexity)
# - Security vulnerability scanning (OWASP Top 10, CWE)
# - Technical debt estimation (hours to fix all issues)
# - Quality gates (block merge if code quality drops)
# - Coverage reporting (visualizes which lines are covered)
# - Branch analysis (analyze PRs before merge)
#
# At banks/healthcare: SonarQube is MANDATORY. Code cannot ship without passing.

sonar.projectKey=frontend-react
sonar.projectName=Employee Management Frontend
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclude from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/*.stories.tsx,\
  **/*.stories.ts,\
  **/mocks/**,\
  **/__tests__/**,\
  **/dist/**,\
  **/coverage/**,\
  **/e2e/**

# TypeScript specific
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions (don't penalize for not testing config files)
sonar.coverage.exclusions=\
  src/main.tsx,\
  src/vite-env.d.ts,\
  src/config/**,\
  src/mocks/**,\
  **/*.stories.tsx,\
  **/*.d.ts

# Duplication exclusions
sonar.cpd.exclusions=\
  **/*.stories.tsx,\
  **/*.test.tsx,\
  **/locales/**

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate thresholds (defined in SonarQube server, referenced here)
# Typical MNC quality gates:
# - Coverage on new code >= 80%
# - No new blockers or critical issues
# - Duplicated lines on new code < 3%
# - Maintainability rating >= A
# - Reliability rating >= A
# - Security rating >= A
